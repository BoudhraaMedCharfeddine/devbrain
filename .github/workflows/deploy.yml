name: deploy

on:
  push:
    branches: [develop]

env:
  IMAGE: ghcr.io/boudhraamedcharfeddine/devbrain

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6   # bump the major if the action complains
        with:
          enable-cache: true

      - name: Install dependencies (incl. dev extra)
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (linux/amd64 for Hetzner)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: BoudhraaMedCharfeddine/platform-private
          token: ${{ secrets.PLATFORM_PRIVATE_TOKEN }}
          path: platform-private

      - name: Bump image tag and push
        working-directory: platform-private
        run: |
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${GITHUB_SHA}|" k3s/devbrain/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k3s/devbrain/deployment.yaml
          git commit -m "chore(devbrain): deploy ${GITHUB_SHA}" || echo "nothing to commit"
          git push